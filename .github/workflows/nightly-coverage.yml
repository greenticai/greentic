name: Nightly Coverage

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2

      # The action downloads the binary from GitHub releases; a transient 5xx
      # (HTTP 504) can outlast its internal curl retries, so retry once more.
      - name: Install cargo-binstall
        id: binstall_a
        continue-on-error: true
        uses: cargo-bins/cargo-binstall@main

      - name: Wait before retrying cargo-binstall install
        if: steps.binstall_a.outcome == 'failure'
        run: sleep 30

      - name: Install cargo-binstall (retry)
        if: steps.binstall_a.outcome == 'failure'
        uses: cargo-bins/cargo-binstall@main

      - name: Install coverage toolchain
        # Without a token, binstall queries api.github.com anonymously and gets
        # rate-limited (403 Forbidden) per runner IP. It does not fail on that:
        # it silently falls back to building from source via `cargo install`
        # without --locked, which cargo-nextest rejects with a deliberate
        # compile_error!, so the job burns ~11 minutes and exits 70 looking like
        # a Rust build break. --disable-strategies compile makes that fallback
        # fatal at the install step instead of silent.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rust-cache restores ~/.cargo/.crates.toml but prunes ~/.cargo/bin of
          # binstall-installed binaries, so binstall says "already installed"
          # while the binary is gone. --force sidesteps that.
          # Release asset downloads can hit transient 5xx (e.g. HTTP 504), so
          # retry each install up to 3 times (20s, then 40s backoff) and fail
          # with the last exit code if every attempt fails.
          binstall_retry() {
            local attempt=1 rc=0 delay=20
            while true; do
              cargo binstall -y --force --disable-strategies compile "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 3 ]; then
                echo "cargo binstall $* failed after $attempt attempts (exit $rc)" >&2
                return "$rc"
              fi
              echo "cargo binstall $* failed (exit $rc); retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          binstall_retry cargo-llvm-cov
          binstall_retry cargo-nextest
          binstall_retry greentic-dev
          command -v cargo-llvm-cov
          command -v cargo-nextest
          command -v greentic-dev
          greentic-dev --version

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Validate coverage policy
        run: greentic-dev coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: target/coverage/coverage.json
          if-no-files-found: ignore
